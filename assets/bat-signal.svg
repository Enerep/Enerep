<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="280" viewBox="0 0 900 280"
     role="img" aria-labelledby="title desc">
  <title id="title">BAT. — a little bit of everything.</title>
  <desc id="desc">
    A lime bat jumps into a prismatic signal ring, then rests.
  </desc>

  <defs>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#cfff9e"/>
      <stop offset=".35" stop-color="#85e7ff"/>
      <stop offset=".7" stop-color="#c5a1ff"/>
      <stop offset="1" stop-color="#ffb58b"/>
    </linearGradient>

    <path id="bat"
      d="M-64-20C-44-16-32-9-18 3L-12-13-4-4H4L12-13 18 3C32-9 44-16 64-20 56-2 45 6 32 1 30 20 18 21 8 14L0 27-8 14C-18 21-30 20-32 1-45 6-56-2-64-20Z"/>

    <clipPath id="slice">
      <path d="M-70-4H70V4H-70ZM-70 15H70V19H-70Z"/>
    </clipPath>
  </defs>

  <style>
    text { font-family: Arial, Helvetica, sans-serif }
    .mono {
      font-family: monospace;
      font-size: 13px;
      letter-spacing: 2px;
    }
    .bat { animation: arrive 8s steps(1,end) infinite }
    .ghost {
      opacity: 0;
      animation: echo 8s steps(1,end) infinite;
    }
    .pulse {
      opacity: 0;
      animation: ripple 8s ease-out infinite;
    }
    .second { animation-delay: .5s }

    @keyframes arrive {
      0%,5% { transform: translate(-120px,-12px); opacity: 0 }
      8% { transform: translate(-80px,14px); opacity: .5 }
      11% { transform: translate(-35px,-8px); opacity: .8 }
      14% { transform: translate(10px,5px); opacity: 1 }
      18%,100% { transform: translate(0,0); opacity: 1 }
    }
    @keyframes echo {
      0%,7%,19%,100% { opacity: 0 }
      8%,18% { opacity: .5 }
    }
    @keyframes ripple {
      0% { transform: scale(.55); opacity: 0 }
      15% { opacity: .5 }
      45%,100% { transform: scale(1.7); opacity: 0 }
    }
    @media (prefers-reduced-motion: reduce) {
      .bat,.ghost,.pulse { animation: none }
      .ghost,.pulse { display: none }
    }
  </style>

  <rect x=".5" y=".5" width="899" height="279"
        rx="18" fill="#080b0a" stroke="#25302a"/>

  <text x="44" y="48" class="mono" fill="#a1afa5">
    ENEREP / BAT-OCHIR
  </text>
  <circle cx="715" cy="43" r="3" fill="#cfff9e"/>
  <text x="856" y="48" class="mono"
        text-anchor="end" fill="#cfff9e">SIGNAL FOUND</text>

  <text x="40" y="194" font-size="142" font-weight="800"
        letter-spacing="-9" fill="#f3f6ef">BAT.</text>

  <g transform="translate(690 147)">
    <circle r="81" fill="none" stroke="#26352d"/>
    <circle r="65" fill="none"
            stroke="url(#prism)" stroke-opacity=".7"/>
    <circle class="pulse" r="65"
            fill="none" stroke="#cfff9e"/>
    <circle class="pulse second" r="65"
            fill="none" stroke="#85e7ff"/>
    <g class="bat">
      <use href="#bat" fill="#cfff9e"/>
      <g class="ghost" clip-path="url(#slice)"
         transform="translate(-9 3)">
        <use href="#bat" fill="#b99bff"/>
      </g>
    </g>
  </g>

  <text x="46" y="226" font-size="17" fill="#a1afa5">
    a little bit of everything.
  </text>
  <path d="M44 251H856"
        stroke="url(#prism)" stroke-opacity=".5"/>
</svg>
